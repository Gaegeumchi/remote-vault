[project]
name = "remote-vault"
version = "0.1.0"
description = "MCP server that stores SSH/SFTP/FTP credentials in the OS keyring and lets agents run commands and move files by connection name."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3",
    "paramiko>=3.4",
    "keyring>=25.0",
]

[project.scripts]
remote-vault = "remote_vault.cli:main"
remote-vault-mcp = "remote_vault.server:main"

[dependency-groups]
dev = [
    "asyncssh>=2.14",
    "pyftpdlib>=1.5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_vault"]
